<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark" data-gamma="blue" data-style="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>Демо навигации — Журнал 24ДММ-2</title>
<link rel="icon" href="../icons/icon-192.png">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="demo-kit.css">

<style>
/* ===== Панель переключателей. Только для демо, в приложение не переносится. ===== */
.dp {
  position: sticky; top: 0; z-index: 90;
  background: #0b0b0c;
  color: #e9e9ee;
  border-bottom: 1px solid #2a2a2e;
  font-family: var(--font-sans);
  letter-spacing: -0.3px;
}
.dp-bar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
  width: 100%; border: 0; background: none; color: inherit;
  font: inherit; font-size: 13px; text-align: left;
}
.dp-bar b { color: #fff; }
.dp-now { flex: 1 1 auto; min-width: 0; color: #8e8e96; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-caret { transition: transform .2s; flex: 0 0 auto; }
.dp.is-open .dp-caret { transform: rotate(180deg); }
.dp-body { display: none; padding: 0 12px 12px; }
.dp.is-open .dp-body { display: block; }
.dp-grp { margin-top: 10px; }
.dp-grp > span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #76767c; margin-bottom: 5px; }
.dp-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.dp-opt {
  padding: 6px 11px; border-radius: 999px;
  background: #1c1c20; border: 1px solid #2e2e34; color: #c9c9d1;
  font: inherit; font-size: 12.5px; line-height: 1.2;
}
.dp-opt.is-on { background: #0a84ff; border-color: #0a84ff; color: #fff; font-weight: 600; }
.dp-swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; vertical-align: -1px; margin-right: 5px; }
.dp-note { margin-top: 10px; font-size: 11.5px; color: #70707a; line-height: 1.45; }
.dp-note code { color: #9cc9ff; }

/* От 1024 px таб-бар превращается в боковую панель и прижимается к верху окна.
   Чтобы панель демо не оказалась под ней, панель и шапка сдвигаются на её высоту
   (--dp-h ставит скрипт). */
@media (min-width: 1024px) {
  .dp { z-index: 95; }
  .ui-tabbar { top: var(--dp-h, 0px) !important; }
  .ui-head { top: var(--dp-h, 0px); }
}

/* Экран демо живёт внутри .ui-app, панель — снаружи */
body { margin: 0; background: #0b0b0c; }
</style>
</head>
<body>

<!-- ===== Панель переключателей ===== -->
<div class="dp" id="dp">
  <button type="button" class="dp-bar" id="dpToggle" aria-expanded="false" aria-controls="dpBody">
    <b>Демо</b>
    <span class="dp-now" id="dpNow">—</span>
    <svg class="dp-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="dp-body" id="dpBody">
    <div class="dp-grp">
      <span>Навигация</span>
      <div class="dp-opts" id="dpNav"></div>
    </div>
    <div class="dp-grp">
      <span>Стиль</span>
      <div class="dp-opts" id="dpStyle"></div>
    </div>
    <div class="dp-grp">
      <span>Тема</span>
      <div class="dp-opts" id="dpTheme"></div>
    </div>
    <div class="dp-grp">
      <span>Палитра</span>
      <div class="dp-opts" id="dpGamma"></div>
    </div>
    <div class="dp-grp">
      <span>Роль</span>
      <div class="dp-opts" id="dpRole"></div>
    </div>
    <p class="dp-note">
      Демо на тестовых данных. Ничего не отправляется в GitHub и Supabase, <code>data.json</code> не меняется —
      всё живёт в памяти вкладки и сбрасывается при перезагрузке.
      Выбор запоминается в адресе: ссылкой можно поделиться.
    </p>
  </div>
</div>

<!-- ===== Приложение ===== -->
<div class="ui-app" id="app">
  <header class="ui-head">
    <button type="button" class="ui-head-btn" id="btnMenu" aria-label="Меню" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button type="button" class="ui-head-btn" id="btnBack" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="ui-head-title" id="headTitle">Журнал</h1>
    <button type="button" class="ui-head-btn" id="btnBell" aria-label="Объявления">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <span class="ui-dot-abs" id="bellDot" hidden></span>
    </button>
  </header>

  <main class="ui-main" id="view" tabindex="-1"></main>

  <nav class="ui-tabbar" id="tabbar" aria-label="Разделы"></nav>

  <button type="button" class="ui-fab" id="fab" aria-label="Быстрые действия" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- Листы и меню создаются скриптом -->
<div id="layers"></div>

<script src="demo-data.js"></script>
<script src="demo-app.js"></script>
</body>
</html>
